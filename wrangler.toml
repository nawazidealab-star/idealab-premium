name = "idealab-premium-api"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "idealab-crm"
database_id = "023c6004-fb3a-41d4-8c4f-bccf51409fae"

[vars]
# Example: idealab.cloudflareaccess.com (do not include https://)
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
# Cloudflare Access application AUD tag for the protected admin/API application.
CF_ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD_TAG"
# Your own authenticated email. On first successful Access login this account is bootstrapped as super_admin.
SUPER_ADMIN_EMAIL = "REPLACE_WITH_YOUR_EMAIL"
# Comma-separated exact frontend origins if API is on another hostname.
# Example: https://idealab.pages.dev,https://idealab.example.com
ALLOWED_ORIGINS = ""
