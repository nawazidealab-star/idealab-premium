name: IDEA LAB Portal Diagnostics

on:
  push:
    branches: [native-mobile-admin-mvp]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'package.json'
      - '.github/workflows/portal-diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Capture build output
        id: build
        continue-on-error: true
        run: npm run build > portal-build.log 2>&1
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: portal-build-diagnostics
          path: portal-build.log
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
